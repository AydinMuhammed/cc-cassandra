services:
  cassandra1:
    image: cassandra:5.0
    container_name: cassandra1
    hostname: cassandra1
    environment:
      CASSANDRA_CLUSTER_NAME: chat-cluster
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    ports:
      - "9042:9042"
    volumes:
      - cass1-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 60s

  cassandra2:
    image: cassandra:5.0
    container_name: cassandra2
    hostname: cassandra2
    environment:
      CASSANDRA_CLUSTER_NAME: chat-cluster
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    ports:
      - "9043:9042"
    volumes:
      - cass2-data:/var/lib/cassandra
    depends_on:
      cassandra1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 60s

  # Charge le schéma puis les données de démo une fois les deux nœuds prêts.
  init:
    image: cassandra:5.0
    container_name: cassandra-init
    depends_on:
      cassandra1:
        condition: service_healthy
      cassandra2:
        condition: service_healthy
    volumes:
      - ./schema.cql:/scripts/schema.cql:ro
      - ./seed.cql:/scripts/seed.cql:ro
    entrypoint: ["sh", "-c"]
    command:
      - "cqlsh cassandra1 9042 -f /scripts/schema.cql && cqlsh cassandra1 9042 -f /scripts/seed.cql && echo 'Schema et donnees charges'"
    restart: "no"

volumes:
  cass1-data:
  cass2-data:
